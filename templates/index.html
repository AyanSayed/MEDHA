<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediPi Dashboard</title>
    <style>
        body {
            font-family: -apple-system, Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .value {
            font-size: 64px;
            font-weight: bold;
            color: #38bdf8;
            margin: 10px 0;
        }
        .status {
            font-size: 14px;
            color: #94a3b8;
        }
        h1 {
            font-size: 20px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Live Sensor Reading</h1>
        <div class="value" id="value">--</div>
        <div class="status" id="status">connecting...</div>
        <div class="status" id="timestamp"></div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                document.getElementById('value').innerText = data.value ?? '--';
                document.getElementById('status').innerText = 'Status: ' + data.status;
                document.getElementById('timestamp').innerText = 'Last updated: ' + (data.timestamp ?? '--');
            } catch (e) {
                document.getElementById('status').innerText = 'Connection lost';
            }
        }
        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>
</html>
